name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descarrega el repositori
        uses: actions/checkout@v6

      - name: Instal·la Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instal·la les dependències
        run: pip install -r requirements.txt

      - name: Genera el web (mode estricte)
        run: mkdocs build --strict --site-dir site

      - name: Prepara el web per a GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
