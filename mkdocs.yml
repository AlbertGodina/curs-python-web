site_name: "Curs de Python: De Zero a Hero"
site_description: "Material docent per aprendre Python des de zero."
site_author: "Albert Godina Lapaz"

# Adreça del web publicat a GitHub Pages
site_url: https://albertgodina.github.io/curs-python-web/
# Adreça del repositori 
repo_url: https://github.com/albertgodina/curs-python-web
edit_uri: ""

theme:
  name: material
  language: ca
  palette:
    # Mode clar per defecte
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Canviar a mode fosc
    # Mode fosc
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Canviar a mode clar
  features:
    - navigation.sections       # Agrupa seccions al menú lateral
    - navigation.top            # Botó per tornar amunt
    - navigation.footer         # Enllaços "Anterior / Següent" al peu de pàgina
    - content.code.copy         # Botó per copiar codi fàcilment
    - content.code.annotate     # Anotacions al codi
    - toc.follow                # L'índex segueix el scroll
    - search.suggest            # Suggeriments de cerca
    - search.highlight          # Ressalta termes buscats

markdown_extensions:
  - admonition                  # Blocs !!! note, !!! warning, !!! failure...
  - pymdownx.details            # Desplegables ??? success (solucions)
  - pymdownx.superfences        # Blocs de codi (també dins de les caixes)
  - pymdownx.highlight:         # Ressaltat de sintaxi del codi
      anchor_linenums: true
  - pymdownx.inlinehilite       # Codi dins del text amb ressaltat
  - pymdownx.tabbed:            # Pestanyes
      alternate_style: true
  - attr_list
  - toc:
      permalink: true          # Enllaços directes als títols

plugins:
  - search

# Si més endavant es creen docs/stylesheets/extra.css, descomentar aquestes línies:
# extra_css:
#   - stylesheets/extra.css

# Rutes relatives a la carpeta docs/
nav:
  - Inici: index.md
  - "0. Preparació de l'entorn": 00-preparacio.md
  - "1. Variables i entrada/sortida": 01-variables-entrada-sortida.md
  - "2. Operadors i text bàsic": 02-operadors-text.md
  - "3. Condicionals": 03-condicionals.md
  - "4. Bucles": 04-bucles.md
  - "5. Funcions": 05-funcions.md
  - "6. Llistes": 06-llistes.md
  - "7. Projecte final": 07-projecte-final.md
  # - Extres:
  #     - "Tuples": extres/tuples.md
  #     - "Diccionaris": extres/diccionaris.md
  #     - "Fitxers": extres/fitxers.md
  #     - "Gestió d'errors (try/except)": extres/try-except.md
